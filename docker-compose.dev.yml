services:

    #service 1
    postgres:
        image: postgres:18.4
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: enroute
            POSTGRES_USER: enrouteDb
            POSTGRES_PASSWORD: enroute09832
        volumes: 
          - postgres_data:/var/lib/postgresql
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U enrouteDb -d enroute"]
          interval: 5s
          timeout: 5s
          retries: 5

